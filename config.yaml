---
base_dir: logs
base_model_dir: models
log_level: INFO

model:
  seq_len: 7
  horizon: 7
  input_var: 6
  input_dim: 1 
  output_dim: 1
  latent_dim: 32
  n_traj_samples: 3 
  ode_method: dopri5
  odeint_atol: 0.0003
  odeint_rtol: 0.0003 
  rnn_units: 16
  num_rnn_layers: 2
  gcn_step: 2
  filter_type: diff_adv #diff_adv, diff, adv, unkP
  recg_type: gru 
  save_latent: false
  nfe: false

train:
  base_lr: 0.05 #italy france england spain 0.05, france 0.07
  weight_decay: 0.5 
  dropout: 0
  load: 0 
  epoch: 0 
  epochs: 50
  epsilon: 1.0e-3
  lr_decay_ratio: 0.5
  max_grad_norm: 5
  min_learning_rate: 2.0e-06
  optimizer: adam
  patience: 10
  steps: [25, 35, 45, 55] #italy [15, 25, 35, ], spain [20, 30, 40, 50]
  test_every_n_epochs: 10
  results_dir: results